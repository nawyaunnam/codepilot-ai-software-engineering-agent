[project]
name="codepilot"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastembed>=0.4,<1","python-multipart>=0.0.20,<1","langchain-openai>=0.3,<2","fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","redis>=5,<7","httpx>=0.27,<1","python-jose[cryptography]>=3.3,<4","tree-sitter-language-pack>=0.6,<1","scikit-learn>=1.5,<2","numpy>=1.26,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9","ruff>=0.6,<1"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["backend"]
[tool.pytest.ini_options]
pythonpath=["backend"]
testpaths=["backend/tests"]
[tool.ruff]
line-length=110
[tool.ruff.lint]
select=["E","F","I","B"]
ignore=["B008","E501"]
