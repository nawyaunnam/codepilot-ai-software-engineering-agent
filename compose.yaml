name: codepilot
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: codepilot, POSTGRES_PASSWORD: codepilot, POSTGRES_DB: codepilot}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U codepilot"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: [.env]
    volumes: ["./workspace:/workspace", "embedding-cache:/tmp/codepilot-embeddings"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  sandbox:
    build: ./sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Run scripts/setup.py}
      TEST_IMAGE: codepilot-test-runtime:local
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    # Broker only; test containers never receive the socket or credentials.
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  test-runtime:
    image: codepilot-test-runtime:local
    build: {context: ./sandbox, dockerfile: Runtime.Dockerfile}
    command: ["true"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  embedding-cache:
