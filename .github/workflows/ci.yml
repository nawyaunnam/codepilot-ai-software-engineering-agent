name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check backend
      - run: pytest -q
  sandbox:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sandbox}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache: false}
      - run: go test ./...
      - run: go vet ./...
      - run: docker build -f Runtime.Dockerfile -t codepilot-test-runtime:local .
      - run: RUN_DOCKER_TESTS=1 go test -v ./...
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: python -c "from pathlib import Path; p=Path('.env'); p.write_text(p.read_text().replace('SANDBOX_TOKEN=\n', 'SANDBOX_TOKEN=ci-only-sandbox-token-32-characters-long\n'))"
      - run: docker compose config --quiet
      - run: docker compose build api sandbox frontend test-runtime
